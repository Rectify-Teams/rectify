name: Deploy VitePress docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/rectify-docs/**"
      - "apps/rectify-vs-react/**"
      - "packages/**"
      - "libs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build VitePress docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter='!rectify-docs' --filter='!rectify-vs-react' --filter='!rectify-example' --filter='!rectify-benchmark' build

      - name: Build benchmark app
        working-directory: apps/rectify-vs-react
        env:
          VITE_BASE: /rectify/perf-benchmark/
        run: pnpm build

      - name: Copy benchmark into VitePress public folder
        run: cp -r apps/rectify-vs-react/dist apps/rectify-docs/docs/public/perf-benchmark

      - name: Build VitePress docs
        working-directory: apps/rectify-docs
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/rectify-docs/docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
